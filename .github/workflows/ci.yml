name: CI
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  pull_request:
    branches:
      - master
      - Staging
  push:
    branches:
      - '*'

jobs:
  checks:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Node Modules
        id: bun-cache
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ./node_modules
          key:
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./bun.lock') }}

      - name: Install Packages
        run: bun install --frozen-lockfile

      - name: Check Formatting
        run: bun run lint

      - name: Check Formatting (Astro)
        run: bun astro check

      - name: Run API Tests
        run: bun run test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./html/coverage

  build:
    name: Build Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Node Modules
        id: bun-cache
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ./node_modules
          key:
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./bun.lock') }}

      - name: Install Packages
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun install --global vercel@latest

      - name: Pull Vercel Environment Information (Dev)
        if: ${{ github.ref_name != 'master' }}
        run:
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment Information (Prod)
        if: ${{ github.ref_name == 'master' }}
        run:
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Add Database File
        run:
          mkdir ./packages/server/docker/dev/database && touch
          ./packages/server/docker/dev/database/latest.db

      - name: Build Project (Dev)
        if: ${{ github.ref_name != 'master' }}
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project (Prod)
        if: ${{ github.ref_name == 'master' }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Dev)
        if: ${{ github.ref_name != 'master' }}
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Prod)
        if: ${{ !github.head_ref && github.ref_name == 'master' }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
